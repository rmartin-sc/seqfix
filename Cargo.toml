[package]
name = "seqfix"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Normalize numeric filename prefixes into a clean, gap-free sequence"
license = "MIT"
authors = ["Rodney Martin"]
repository = "https://github.com/rmartin-sc/seqfix"
homepage = "https://rmartin-sc.github.io/seqfix/"
readme = "README.md"
keywords = ["rename", "filename", "sequence", "cli", "numbering"]
categories = ["command-line-utilities", "filesystem"]
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
